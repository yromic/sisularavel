version: "1.3.0"
description: "Field-level validation rules contract for SISURAT Laravel FormRequests (v1.3.0)"

requests:
  StoreIncomingLetterRequest:
    fields:
      nomor_surat:
        rules: ["required", "string", "max:100"]
        description: "Official incoming letter number (External; no unique constraint; duplicate advisory checked separately)"
      asal_surat:
        rules: ["required", "string", "max:255"]
        description: "Sender / issuing institution"
      tanggal_surat:
        rules: ["required", "date", "date_format:Y-m-d", "before_or_equal:today"]
        description: "Date printed on the letter"
      tanggal_diterima:
        rules: ["required", "date", "date_format:Y-m-d", "after_or_equal:tanggal_surat"]
        description: "Date physical or digital copy was received"
      perihal:
        rules: ["required", "string", "max:1000"]
        description: "Subject / matter of the letter"
      file:
        rules: ["nullable", "file", "mimes:pdf,doc,docx,jpg,jpeg,png", "max:10240"]
        description: "Document attachment binary (max 10MB)"

  StoreOutgoingLetterRequest:
    fields:
      nomor_surat:
        rules: ["required", "string", "max:100", "unique:outgoing_letters,letter_number,NULL,id,division_id,{division_id},letter_year,{letter_year}"]
        description: "Official outgoing letter number (Enforced unique within division and calendar year)"
      tanggal_surat:
        rules: ["required", "date", "date_format:Y-m-d", "before_or_equal:today"]
        description: "Date issued"
      tanggal_share:
        rules: ["nullable", "date", "date_format:Y-m-d", "after_or_equal:tanggal_surat"]
        description: "Dissemination date"
      perihal:
        rules: ["required", "string", "max:1000"]
        description: "Subject / matter"
      file:
        rules: ["nullable", "file", "mimes:pdf,doc,docx,jpg,jpeg,png", "max:10240"]
        description: "Document attachment binary (max 10MB)"

  PublicClaimPiagamRequest:
    fields:
      piagam_id:
        rules: ["required", "integer", "exists:piagams,id"]
        description: "Target certificate ID"
      npsn:
        rules: ["required", "string", "size:8", "exists:schools,npsn"]
        description: "8-digit school identification code"
      recipient_name:
        rules: ["required", "string", "max:150"]
        description: "Full name of the claiming representative"
      recipient_position:
        rules: ["required", "string", "max:100"]
        description: "Official job role of claimant"
      recipient_unit:
        rules: ["required", "string", "max:150"]
        description: "School or organizational department"
      signature_canvas:
        rules: ["required", "string", "starts_with:data:image/"]
        description: "Base64 encoded digital signature image"

  StoreUserRequest:
    fields:
      username:
        rules: ["required", "string", "min:3", "max:50", "unique:users,username", "alpha_dash"]
        description: "Unique login identifier"
      password:
        rules: ["required", "string", "min:8"]
        description: "Plain password to be hashed via Bcrypt"
      name:
        rules: ["required", "string", "max:150"]
        description: "User display name"
      email:
        rules: ["nullable", "email", "max:150", "unique:users,email"]
        description: "Contact email"
      role:
        rules: ["required", "in:super_admin,division_admin,operator"]
        description: "User role slug"
      division_id:
        rules: ["required_unless:role,super_admin", "nullable", "exists:divisions,id"]
        description: "Assigned division ID"
      is_active:
        rules: ["boolean"]
        description: "Account operational state"
      must_reset_password:
        rules: ["boolean"]
        description: "Flag requiring password reset on first login"

  IdempotencyHeaderValidation:
    headers:
      Idempotency-Key:
        rules: ["required", "uuid"]
        description: "UUIDv4 token to guarantee request idempotency on create mutations"
