version: "1.3.0"
description: "Relational entity schema and relationship contract for SISURAT Laravel (v1.3.0)"

entities:
  - table: "divisions"
    model: "Division"
    description: "Organizational divisions / departments within the agency"
    primary_key: "id"
    ownership: "GLOBAL"
    soft_deletes: true
    relationships:
      - type: "hasMany"
        target: "User"
      - type: "hasMany"
        target: "IncomingLetter"
      - type: "hasMany"
        target: "OutgoingLetter"
      - type: "hasMany"
        target: "Piagam"

  - table: "users"
    model: "User"
    description: "System user accounts"
    primary_key: "id"
    ownership: "DIVISION_SCOPED"
    soft_deletes: true
    relationships:
      - type: "belongsTo"
        target: "Division"

  - table: "schools"
    model: "School"
    description: "Master reference data of educational institutions"
    primary_key: "id"
    ownership: "GLOBAL"
    soft_deletes: false
    relationships:
      - type: "hasMany"
        target: "Piagam"

  - table: "incoming_letters"
    model: "IncomingLetter"
    description: "Archival records of incoming official correspondence (External numbering, non-unique, advisory duplicate warnings)"
    primary_key: "id"
    ownership: "SINGLE_DIVISION_IMMUTABLE_V1"
    soft_deletes: true
    relationships:
      - type: "belongsTo"
        target: "Division"
      - type: "morphMany"
        target: "Attachment"
        as: "attachable"

  - table: "outgoing_letters"
    model: "OutgoingLetter"
    description: "Archival records of outgoing official correspondence (Enforced unique on division_id, letter_year, letter_number)"
    primary_key: "id"
    ownership: "SINGLE_DIVISION_IMMUTABLE_V1"
    soft_deletes: true
    relationships:
      - type: "belongsTo"
        target: "Division"
      - type: "morphMany"
        target: "Attachment"
        as: "attachable"

  - table: "piagams"
    model: "Piagam"
    description: "Student awards, competitions, and certificate retrieval records"
    primary_key: "id"
    ownership: "SINGLE_DIVISION_IMMUTABLE_V1"
    soft_deletes: true
    relationships:
      - type: "belongsTo"
        target: "Division"
      - type: "belongsTo"
        target: "School"
      - type: "morphMany"
        target: "Attachment"
        as: "attachable"

  - table: "attachments"
    model: "Attachment"
    description: "Polymorphic private file binaries, signatures, and durable missing legacy file tracking"
    primary_key: "id"
    ownership: "DIVISION_SCOPED"
    soft_deletes: true
    relationships:
      - type: "morphTo"
        name: "attachable"
      - type: "belongsTo"
        target: "Division"

  - table: "pickup_categories"
    model: "PickupCategory"
    description: "Delivery or retrieval status options for certificates"
    primary_key: "id"
    ownership: "DIVISION_SCOPED"
    soft_deletes: false
    relationships:
      - type: "belongsTo"
        target: "Division"

  - table: "competition_categories"
    model: "CompetitionCategory"
    description: "Competition categories"
    primary_key: "id"
    ownership: "DIVISION_SCOPED"
    soft_deletes: false
    relationships:
      - type: "belongsTo"
        target: "Division"

  - table: "settings"
    model: "Setting"
    description: "Global key-value application configuration"
    primary_key: "id"
    ownership: "GLOBAL"
    soft_deletes: false

  - table: "audit_logs"
    model: "AuditLog"
    description: "Immutable operational audit and security event log"
    primary_key: "id"
    ownership: "GLOBAL"
    soft_deletes: false

  - table: "idempotency_keys"
    model: "IdempotencyKey"
    description: "Server-side duplicate submission prevention and response replay caching"
    primary_key: "id"
    ownership: "USER_AND_DIVISION_SCOPED"
    soft_deletes: false
